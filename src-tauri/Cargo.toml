[workspace]
members = ["crates/theorem-sync-core", "crates/theorem-core"]
resolver = "2"

[package]
name = "theorem"
version = "1.6.1"
description = "Local-first desktop reader for PDFs, EPUBs, MOBI, and RSS."
authors = ["Fundamentals"]
license = "MIT"
homepage = "https://github.com/fundaments-work/Theorem"
repository = "https://github.com/fundaments-work/Theorem"
edition = "2021"
default-run = "theorem"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "theorem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No "devtools" here, so release builds do not ship the web inspector; see
# the `devtools` feature below.
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-barcode-scanner = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-mobile-folder-scan = { path = "plugins/mobile-folder-scan" }
tauri-plugin-android-tts-audio = { path = "plugins/android-tts-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# Companion audiobook parsing (.m4b chapters/duration/cover, .mp3 ID3v2 CHAP)
mp4ameta = "0.13"
id3 = "1"

# 0.13 is the version tauri and iroh already use. Its own rustls setup would
# verify through the OS trust store (rustls-platform-verifier, which Android
# must initialise through JNI), so `http.rs` hands every client a rustls config
# with the ring provider and the bundled webpki roots, as 0.12 built them.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider", "cookies", "stream"] }
webpki-roots = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# ── LAN Device Sync ──
theorem-sync-core = { path = "crates/theorem-sync-core" }
theorem-core = { path = "crates/theorem-core" }
# "process" is only needed for desktop TTS shells (spd-say / say / powershell);
# excluded on Android to keep the native lib lean.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
futures = "0.3"

hex = "0.4"
uuid = { version = "1", features = ["v4"] }
bzip2 = "0.6"
tar = "0.4"
zip = "9"
flate2 = "1.0"
memmap2 = "0.9"
rayon = "1.10"
sha2 = "0.11"
# OS randomness for sync pairing secrets (sync_access.rs) and TTS latent
# noise. 0.10 matches iroh, so only one rand is compiled.
rand = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
walkdir = "2"
tempfile = "3"

# Crypto provider for rustls (reqwest 0.13 is built with rustls-no-provider
# for iroh and tauri; lib.rs installs ring as the process default so their TLS
# doesn't panic, and http.rs builds Theorem's own clients on ring explicitly).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# EPUB pre-parser: streaming XML (replaces regex) + percent-encoded path fallback
regex = "1"
quick-xml = "0.36"
# Helix SIMD-accelerated fuzzy matcher for Two-Tier search & typeahead
nucleo-matcher = "0.3.1"
percent-encoding = "2"
iroh = "1.0.2"
iroh-docs = "0.101.0"
iroh-blobs = { version = "0.103.0", features = ["fs-store"] }
iroh-gossip = "0.101.0"
iroh-mdns-address-lookup = "0.6.0"
readability = { version = "0.3.0", default-features = false }
url = "2.5.8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rars = "0.11.0"
jpeg-encoder = { version = "0.7", features = ["simd"] }

[dev-dependencies]
# tauri::test::mock_app, for the pairing protocol tests in iroh_sync.rs.
tauri = { version = "2", features = ["test"] }
# A local relay server (iroh::test_utils::run_relay_server) and relay TLS that
# trusts it, for the sync tests over a relay (src/sync_scenarios.rs).
iroh = { version = "1.3.0", features = ["test-utils"] }
iroh-relay = { version = "1.3.0", features = ["test-utils"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Desktop TTS shells (spd-say / say / powershell) need tokio process spawning.
# Feature sets are additive per-target, so this only applies on desktop.
tokio = { version = "1", features = ["process"] }
# Headless CLI: argument parsing + interactive TUI. Desktop-only so the
# Android APK keeps its 0 MB CLI footprint.
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "derive", "suggestions", "error-context"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# The CLI resolves the app's data folder itself (as Tauri does), so it runs
# without building an app and therefore without a display.
dirs = "7"
# Neural TTS (Supertonic) inference — desktop only; the ORT shared library
# itself is downloaded at runtime (load-dynamic), so nothing ships here either.
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"] }
ndarray = "0.17"
hound = "3.5"
unicode-normalization = "0.1"
# Native playback of synthesized audio — the webview audio stack proved
# unreliable; rodio/cpal output real device audio.
rodio = { version = "0.23", default-features = false, features = ["playback", "wav"] }
# Save-as-Audiobook Opus encoding. libopus is built from the bundled source
# and linked statically: `static` here (same audiopus_sys version audiopus
# uses) plus LIBOPUS_NO_PKG in .cargo/config.toml, since pkg-config would
# otherwise link the distro's shared libopus.so.0 on Linux.
audiopus = "0.2"
audiopus_sys = { version = "0.1", features = ["static"] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1.1"
jni = { version = "0.22.4", default-features = false, features = ["invocation"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
# Web inspector. `[profile.dev]` turns debug assertions off, so Tauri's own
# debug-build default does not apply here: the `pnpm dev:*` scripts pass
# `--features devtools`, release builds leave it out.
devtools = ["tauri/devtools"]

# End-to-end test build (`pnpm e2e`): embeds the built UI and answers native
# dialogs from a test-controlled queue (src/e2e_hooks.rs). Never shipped.
e2e = ["tauri/custom-protocol"]

# Optimize for release (reduces binary size significantly)
[profile.release]
opt-level = "z"         # Aggressive size optimization (smaller than "s")
strip = "symbols"       # Strip all symbols
lto = "thin"            # Fast parallel Thin LTO
panic = "abort"         # Drop unwinding landing pads / .eh_frame tables (~3-4 MB on iroh/tokio)

# Dev profile: keep debug builds fast
[profile.dev]
debug-assertions = false

[lints.rust]
unknown_lints = "allow"

[lints.clippy]
chunks_exact_to_as_chunks = "allow"

# RAR decoding is CPU intensive; Android debug APKs must handle real comics.
[profile.dev.package.rars]
opt-level = 3

# Cover thumbnails (decode, downscale, re-encode) are most of the cost of a
# folder import. At the release profile's size-first opt-level they took
# ~63 ms per 1200x1800 cover; at opt-level 3 they are several times faster.
[profile.release.package.image]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.release.package.jpeg-encoder]
opt-level = 3
[profile.dev.package.jpeg-encoder]
opt-level = 3
