[workspace]
members = ["crates/theorem-sync-core"]
resolver = "2"

[package]
name = "theorem"
version = "1.4.3"
description = "Local-first desktop reader for PDFs, EPUBs, MOBI, and RSS."
authors = ["Fundamentals"]
license = "MIT"
homepage = "https://github.com/fundaments-work/Theorem"
repository = "https://github.com/fundaments-work/Theorem"
edition = "2021"
default-run = "theorem"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "theorem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-barcode-scanner = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-mobile-folder-scan = { path = "plugins/mobile-folder-scan" }
tauri-plugin-android-tts-audio = { path = "plugins/android-tts-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Companion audiobook parsing (.m4b chapters/duration/cover, .mp3 ID3v2 CHAP)
mp4ameta = "0.11"
id3 = "1"

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "cookies", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# ── LAN Device Sync ──
theorem-sync-core = { path = "crates/theorem-sync-core" }
# "process" is only needed for desktop TTS shells (spd-say / say / powershell);
# excluded on Android to keep the native lib lean.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
futures = "0.3"

hex = "0.4"
uuid = { version = "1", features = ["v4"] }
bzip2 = "0.4"
tar = "0.4"
zip = "2"
flate2 = "1.0"
memmap2 = "0.9"
rayon = "1.10"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
walkdir = "2"
tempfile = "3"

# Crypto provider for rustls (iroh's reqwest v0.13 uses rustls-no-provider;
# this installs the ring-based default provider so TLS doesn't panic).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# EPUB pre-parser: streaming XML (replaces regex) + percent-encoded path fallback
quick-xml = "0.36"
percent-encoding = "2"
iroh = "1.0.2"
iroh-docs = "0.101.0"
iroh-blobs = { version = "0.103.0", features = ["fs-store"] }
iroh-gossip = "0.101.0"
iroh-mdns-address-lookup = "0.4.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
unrar-ng = "0.7.7"
# Desktop TTS shells (spd-say / say / powershell) need tokio process spawning.
# Feature sets are additive per-target, so this only applies on desktop.
tokio = { version = "1", features = ["process"] }
# Headless CLI: argument parsing + interactive TUI. Desktop-only so the
# Android APK keeps its 0 MB CLI footprint.
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "derive", "suggestions", "error-context"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
# Neural TTS (Supertonic) inference — desktop only; the ORT shared library
# itself is downloaded at runtime (load-dynamic), so nothing ships here either.
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"] }
ndarray = "0.17"
hound = "3.5"
unicode-normalization = "0.1"
# Native playback of synthesized audio — the webview audio stack proved
# unreliable; rodio/cpal output real device audio.
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }
# Save-as-Audiobook Opus encoding (libopus built from source or found via
# pkg-config — none of it ships in any binary).
audiopus = "0.2"
audiopus_sys = { version = "0.1", features = ["static"] }
rand = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1.1"
jni = { version = "0.21", default-features = false, features = ["invocation"] }

# Optimize for release (reduces binary size significantly)
[profile.release]
opt-level = "z"         # Aggressive size optimization (smaller than "s")
strip = "symbols"       # Strip all symbols
lto = "thin"            # Fast parallel Thin LTO
panic = "abort"         # Drop unwinding landing pads / .eh_frame tables (~3-4 MB on iroh/tokio)

# Dev profile: keep debug builds fast
[profile.dev]
debug-assertions = false

[lints.rust]
unknown_lints = "allow"

[lints.clippy]
chunks_exact_to_as_chunks = "allow"
