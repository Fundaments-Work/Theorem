[package]
name = "theorem-sync-core"
version = "1.5.0"
edition = "2021"
description = "Theorem sync core library — device identity, QR pairing, and sync protocol types"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time"] }
sha2 = "0.11"

# QR code generation + encoding utilities
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
hex = "0.4"

# Timestamp formatting (replaces manual ISO 8601 calendar math)
time = { version = "0.3", features = ["formatting"] }
