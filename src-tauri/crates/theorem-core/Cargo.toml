[package]
name = "theorem-core"
version = "1.6.1"
edition = "2021"
description = "Pure computational algorithms for Theorem (Markdown, fuzzy ranking, text normalization, vault formats)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
nucleo-matcher = "0.3"
quick-xml = "0.36"
url = "2.5"
percent-encoding = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
