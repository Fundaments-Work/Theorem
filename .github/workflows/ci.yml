name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "1.6.1"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A newer push to the same branch/PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which jobs have anything to check. A skipped job counts as passing, so this is safe
  # with required checks (unlike `paths-ignore`, which leaves a required check pending forever).
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.f.outputs.web }}
      rust: ${{ steps.f.outputs.rust }}
      android: ${{ steps.f.outputs.android }}
      e2e: ${{ steps.f.outputs.e2e }}
      workflows: ${{ steps.f.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-changes.sh

  workflow-check:
    name: Workflow lint and selection tests
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
          shellcheck scripts/ci-changes.sh scripts/release-tag.sh scripts/check-release-assets.sh
      - name: Exercise job selection
        run: node --test scripts/ci-changes.test.mjs scripts/release-tag.test.mjs scripts/check-release-assets.test.mjs

  web:
    name: Web (typecheck, design, tests, build)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.rust == 'true' || (github.event_name != 'pull_request' && needs.changes.outputs.e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The foliate-js submodule is needed by `foliate:check` and the build only.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # pnpm must be on PATH before setup-node so its built-in pnpm store cache works.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Design-system rules
        run: pnpm check:design

      - name: Test
        run: pnpm test

      # Fails if the committed foliate runtime differs from the submodule plus our patches.
      # It replaces a plain sync: a passing check means a sync would change nothing.
      - name: Foliate runtime matches the submodule and patches
        run: pnpm foliate:check

      # `pnpm build` re-runs typecheck, which already ran above.
      - name: Build
        run: pnpm exec vite build && node scripts/verify-pdfjs-assets.mjs && node scripts/check-startup-bundle.mjs

      - name: Share frontend with native checks
        uses: actions/upload-artifact@v7
        with:
          name: ci-frontend
          path: dist
          if-no-files-found: error
          retention-days: 1

  rust-check:
    name: Rust Check
    needs: [changes, web]
    if: needs.changes.outputs.rust == 'true' || (github.event_name != 'pull_request' && needs.changes.outputs.e2e == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_NET_RETRY: 5
      CARGO_HTTP_TIMEOUT: 120
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v7

      # pnpm must be on PATH before setup-node so its built-in pnpm store cache works.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev autoconf automake libtool

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/tauri-driver
            src-tauri/target
          key: ${{ runner.os }}-native-check-v2-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-native-check-v2-cargo-
            ${{ runner.os }}-check-cargo-

      # clippy --all-targets already type-checks everything, so no separate `cargo check`.
      - name: Check Rust formatting
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Restore verified frontend
        uses: actions/download-artifact@v8
        with:
          name: ci-frontend
          path: dist

      - name: Clippy
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-features --all-targets -- -D warnings -A unknown-lints -A clippy::chunks-exact-to-as-chunks

      # Unit and integration tests of the app and every workspace crate.
      # `#[ignore]`d tests hit live catalogs and stay out of CI.
      - name: Test
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --lib --tests

      # Reuse Clippy/test dependencies rather than compiling in a separate job.
      # E2E remains non-blocking; its runner reports a missing build as a failure.
      - name: Prepare E2E binaries
        id: e2e-build
        if: github.event_name != 'pull_request' && needs.changes.outputs.e2e == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo build --manifest-path src-tauri/Cargo.toml --features e2e
          command -v tauri-driver || cargo install tauri-driver --locked
          mkdir -p e2e-bin
          cp src-tauri/target/debug/theorem e2e-bin/theorem
          cp "$(command -v tauri-driver)" e2e-bin/tauri-driver
          strip e2e-bin/theorem e2e-bin/tauri-driver

      - name: Share E2E binaries
        if: steps.e2e-build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ci-e2e-binaries
          path: e2e-bin
          if-no-files-found: error
          retention-days: 1

  rust-android-check:
    # Desktop CI does not compile the `cfg(target_os = "android")` code; the
    # jni 0.22 bump once broke Android while every desktop check passed.
    name: Rust Check (Android)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_NET_RETRY: 5
      CARGO_HTTP_TIMEOUT: 120
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
          components: clippy

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies (bundled pdf.js resources)
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK
        run: sdkmanager "ndk;29.0.13846066"

      - name: Configure NDK toolchain
        run: |
          BIN="$ANDROID_SDK_ROOT/ndk/29.0.13846066/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=$BIN/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang"
            echo "CC_armv7_linux_androideabi=$BIN/armv7a-linux-androideabi24-clang"
            echo "CXX_armv7_linux_androideabi=$BIN/armv7a-linux-androideabi24-clang++"
            echo "AR_armv7_linux_androideabi=$BIN/llvm-ar"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$BIN/armv7a-linux-androideabi24-clang"
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.13846066"
          } >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-android-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-check-

      - name: Clippy (aarch64-linux-android)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android -- -D warnings -A unknown-lints -A clippy::chunks-exact-to-as-chunks

      # The release also builds 32-bit APKs, where usize is 32 bits wide.
      - name: Clippy (armv7-linux-androideabi, 32-bit)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target armv7-linux-androideabi -- -D warnings -A unknown-lints -A clippy::chunks-exact-to-as-chunks

  e2e:
    # End-to-end suite (docs/testing-e2e.md): the real app built with
    # `--features e2e`, driven through tauri-driver + WebKitWebDriver under headless Mutter.
    # Non-blocking while hosted WebKit screenshot failures are investigated.
    # The Rust job supplies the binary; this job only installs the runtime and runs tests.
    name: E2E (Linux, non-blocking)
    needs: [changes, rust-check]
    if: github.event_name != 'pull_request' && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # pnpm must be on PATH before setup-node so its built-in pnpm store cache works.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: WebDriver client regressions
        run: node --test e2e/lib/webdriver.test.mjs

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 libasound2 webkit2gtk-driver mutter libegl-mesa0 libgl1-mesa-dri dbus

      - name: Restore E2E binaries
        uses: actions/download-artifact@v8
        with:
          name: ci-e2e-binaries
          path: e2e-bin

      - name: Restore executable permissions
        run: chmod +x e2e-bin/theorem e2e-bin/tauri-driver

      - name: Run e2e suite
        env:
          THEOREM_E2E_BINARY: ${{ github.workspace }}/e2e-bin/theorem
          TAURI_DRIVER: ${{ github.workspace }}/e2e-bin/tauri-driver
          THEOREM_E2E_DISPLAY: mutter
          LIBGL_ALWAYS_SOFTWARE: "1"
          THEOREM_E2E_ARTIFACTS: ${{ github.workspace }}/e2e/.artifacts
        run: pnpm e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: e2e/.artifacts
          if-no-files-found: ignore
