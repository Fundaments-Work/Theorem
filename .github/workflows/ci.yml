name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which jobs have anything to check. A skipped job counts as passing, so this is safe
  # with required checks (unlike `paths-ignore`, which leaves a required check pending forever).
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.f.outputs.web }}
      rust: ${{ steps.f.outputs.rust }}
      android: ${{ steps.f.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          all() { echo "web=true" >> "$GITHUB_OUTPUT"; echo "rust=true" >> "$GITHUB_OUTPUT"; echo "android=true" >> "$GITHUB_OUTPUT"; }
          # Manual runs, new branches and unreachable bases check everything.
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then all; exit 0; fi
          files="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          has() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          # Docs, issue templates and the like need no build at all.
          shared='^(\.github/workflows/ci\.yml|package\.json|pnpm-lock\.yaml|scripts/|tsconfig.*\.json)'
          echo "web=$(has "$shared|^(src/|tests/|index\.html|ui-gallery\.html|public/|vite\.config|vitest\.config|src-tauri/crates/theorem-core/)")" >> "$GITHUB_OUTPUT"
          echo "rust=$(has "^(\.github/workflows/ci\.yml|src-tauri/|pnpm-lock\.yaml)")" >> "$GITHUB_OUTPUT"
          echo "android=$(has "^(\.github/workflows/ci\.yml|src-tauri/(src|crates|plugins|gen|Cargo|tauri\.conf|capabilities)|pnpm-lock\.yaml)")" >> "$GITHUB_OUTPUT"

  web:
    name: Web (typecheck, design, tests, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The foliate-js submodule is needed by `foliate:check` and the build only.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # pnpm must be on PATH before setup-node so its built-in pnpm store cache works.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Design-system rules
        run: pnpm check:design

      - name: Test
        run: pnpm test

      # Fails if the committed foliate runtime differs from the submodule plus our patches.
      # It replaces a plain sync: a passing check means a sync would change nothing.
      - name: Foliate runtime matches the submodule and patches
        run: pnpm foliate:check

      # `pnpm build` re-runs typecheck, which already ran above.
      - name: Build
        run: pnpm exec vite build && node scripts/verify-pdfjs-assets.mjs && node scripts/check-startup-bundle.mjs

  rust-check:
    name: Rust Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_NET_RETRY: 5
      CARGO_HTTP_TIMEOUT: 120
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v7

      # pnpm must be on PATH before setup-node so its built-in pnpm store cache works.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev autoconf automake libtool

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-check-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-check-cargo-

      # clippy --all-targets already type-checks everything, so no separate `cargo check`.
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      # tauri::generate_context! requires frontendDist (../dist) to exist; this
      # job checks Rust only, so an empty folder stands in for the web build.
      - name: Clippy
        run: |
          mkdir -p dist
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-features --all-targets -- -D warnings -A unknown-lints -A clippy::chunks-exact-to-as-chunks

      # Unit and integration tests of the app and every workspace crate.
      # `#[ignore]`d tests hit live catalogs and stay out of CI.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --lib --tests

  rust-android-check:
    # Desktop CI does not compile the `cfg(target_os = "android")` code; the
    # jni 0.22 bump once broke Android while every desktop check passed.
    name: Rust Check (Android)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_NET_RETRY: 5
      CARGO_HTTP_TIMEOUT: 120
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
          components: clippy

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies (bundled pdf.js resources)
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK
        run: sdkmanager "ndk;29.0.13846066"

      - name: Configure NDK toolchain
        run: |
          BIN="$ANDROID_SDK_ROOT/ndk/29.0.13846066/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$BIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_armv7_linux_androideabi=$BIN/armv7a-linux-androideabi24-clang" >> "$GITHUB_ENV"
          echo "CXX_armv7_linux_androideabi=$BIN/armv7a-linux-androideabi24-clang++" >> "$GITHUB_ENV"
          echo "AR_armv7_linux_androideabi=$BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$BIN/armv7a-linux-androideabi24-clang" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.13846066" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-android-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-check-

      - name: Clippy (aarch64-linux-android)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android -- -D warnings -A unknown-lints -A clippy::chunks-exact-to-as-chunks

      # The release also builds 32-bit APKs, where usize is 32 bits wide.
      - name: Clippy (armv7-linux-androideabi, 32-bit)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target armv7-linux-androideabi -- -D warnings -A unknown-lints -A clippy::chunks-exact-to-as-chunks

  e2e:
    # End-to-end suite (docs/testing-e2e.md): the real app built with
    # `--features e2e`, driven through tauri-driver + WebKitWebDriver under Xvfb.
    # Non-blocking while it proves itself on hosted runners, and it compiles the whole app a
    # second time, so it runs after a merge to main (or by hand), not on every pull request.
    name: E2E (Linux, non-blocking)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    continue-on-error: true
    env:
      CARGO_NET_RETRY: 5
      CARGO_HTTP_TIMEOUT: 120
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # pnpm must be on PATH before setup-node so its built-in pnpm store cache works.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev autoconf automake libtool webkit2gtk-driver xvfb dbus

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/tauri-driver
            src-tauri/target
          key: ${{ runner.os }}-e2e-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-e2e-cargo-

      - name: Install tauri-driver
        run: command -v tauri-driver || cargo install tauri-driver --locked

      - name: Build UI and e2e app
        run: |
          bash scripts/sync-foliate-js.sh
          pnpm exec vite build
          cargo build --manifest-path src-tauri/Cargo.toml --features e2e

      - name: Run e2e suite
        env:
          THEOREM_E2E_DISPLAY: xvfb
          THEOREM_E2E_ARTIFACTS: ${{ github.workspace }}/e2e/.artifacts
        run: pnpm e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/.artifacts
          if-no-files-found: ignore
