name: Release dry run

# Builds the desktop installers exactly as release.yml does, without creating
# or touching a GitHub release. Run it before tagging, and after changing the
# bundle config or release.yml: push to a `release-check/*` branch, or run it
# by hand from the Actions tab once it is on main.

on:
  push:
    branches:
      - 'release-check/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  bundle:
    name: Bundle ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (NSIS + MSI)
            os: windows-latest
            args: ""
            expect: "nsis/*-setup.exe nsis/*-setup.exe.sig msi/*.msi msi/*.msi.sig"
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            expect: "dmg/*.dmg macos/*.app.tar.gz macos/*.app.tar.gz.sig"
          - name: Linux
            os: ubuntu-24.04
            args: "--target x86_64-unknown-linux-gnu"
            expect: "deb/*.deb appimage/*.AppImage appimage/*.AppImage.sig"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev autoconf automake libtool

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync foliate-js submodule
        if: runner.os == 'Linux'
        run: bash scripts/sync-foliate-js.sh

      - name: Regenerate platform icons from source
        run: pnpm tauri icon public/favicon.svg

      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: pnpm tauri build ${{ matrix.args }}

      - name: Check every release asset was produced
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          base=src-tauri/target/release/bundle
          [[ -d "$base" ]] || base=$(ls -d src-tauri/target/*/release/bundle | head -1)
          missing=0
          for pattern in ${{ matrix.expect }}; do
            files=( $base/$pattern )
            if (( ${#files[@]} == 0 )); then
              echo "::error::missing $pattern"
              missing=1
            else
              ls -l "${files[@]}"
            fi
          done
          exit $missing
