name: Release dry run

# Builds the desktop installers exactly as release.yml does, without creating
# or touching a GitHub release. Run it before tagging, and after changing the
# bundle config or release.yml: run it manually from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  frontend:
    name: Prepare release frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/build-release-frontend

  bundle:
    name: Bundle ${{ matrix.name }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (NSIS + MSI)
            os: windows-latest
            args: ""
            expect: "nsis/*-setup.exe nsis/*-setup.exe.sig msi/*.msi msi/*.msi.sig"
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            expect: "dmg/*.dmg macos/*.app.tar.gz macos/*.app.tar.gz.sig"
          - name: Linux
            os: ubuntu-24.04
            args: "--target x86_64-unknown-linux-gnu"
            expect: "deb/*.deb appimage/*.AppImage appimage/*.AppImage.sig"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev autoconf automake libtool

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/restore-release-frontend

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-dry-run-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-dry-run-cargo-

      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: |
          # Restored caches must not satisfy checks with an old installer/signature.
          for directory in src-tauri/target/release/bundle src-tauri/target/*/release/bundle; do
            if [[ -d "$directory" ]]; then rm -rf -- "$directory"; fi
          done
          pnpm tauri build ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json

      - name: Check every release asset was produced
        shell: bash
        env:
          EXPECTED_ASSETS: ${{ matrix.expect }}
        run: bash scripts/check-release-assets.sh "$EXPECTED_ASSETS"
