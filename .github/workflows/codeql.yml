name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan of main so newly published queries still run on a quiet week.
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Application code: React/TypeScript frontend.
          - language: javascript-typescript
            build-mode: none
          # Application code: Tauri/Rust backend. `none` uses rust-analyzer
          # and does not need a full Tauri build.
          - language: rust
            build-mode: none
          # Supply-chain checks for the workflows themselves.
          - language: actions
            build-mode: none
          # Small build/tooling scripts committed to the repository.
          - language: python
            build-mode: none
          - language: ruby
            build-mode: none
          # java-kotlin is intentionally omitted. The only Kotlin is Tauri's
          # generated Android project and the vendored plugin API, and CodeQL
          # requires a full Gradle build for Kotlin analysis.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # CodeQL does not need credentials after checkout.
          persist-credentials: false

      - name: Install Rust build dependencies
        if: matrix.language == 'rust'
        # CodeQL's Rust extractor runs build scripts and compiles macro code,
        # so the same native packages the CI rust-check job needs must exist.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Setup Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
