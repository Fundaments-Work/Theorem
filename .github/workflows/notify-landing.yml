name: Notify Studio & Landing

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'ARCHITECTURE.md'
      - 'README.md'
      - 'CHANGELOG.md'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: notify-landing-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/notify-landing
        with:
          ref: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          deploy-landing: ${{ github.event_name != 'push' }}
        env:
          GH_TOKEN: ${{ secrets.STUDIO_SYNC_TOKEN }}
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
