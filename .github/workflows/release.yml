name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to update (e.g. v1.0.0-5)
        required: true
        type: string

# Serialize attempts for the same tag without cancelling a signing/upload step.
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  create-release:
    name: Create Release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.resolve-tag.outputs.tag }}
      release_sha: ${{ steps.resolve-tag.outputs.sha }}
      prerelease: ${{ steps.resolve-tag.outputs.prerelease }}
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Resolve release tag
        id: resolve-tag
        env:
          REQUESTED_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: bash scripts/release-tag.sh

      - name: Refuse an existing release or draft
        uses: actions/github-script@v8
        with:
          script: |
            const { assertNewRelease } = require('./scripts/release-target.cjs');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            assertNewRelease(releases, ${{ toJSON(steps.resolve-tag.outputs.tag) }});

      - name: Extract Release Notes
        id: release-notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve-tag.outputs.tag }}"
          VER_NUM="${VERSION#v}"
          python3 -c "
          import re
          from pathlib import Path
          changelog = Path('CHANGELOG.md').read_text()
          pattern = r'(## \[' + re.escape('$VER_NUM') + r'\].*?)(?=\n## \[|\Z)'
          match = re.search(pattern, changelog, re.DOTALL)
          if match:
              notes = match.group(1).strip()
              # Remove the title header ## [1.0.4] - 2026-07-03 from the body since we set it in the release name
              notes_body = re.sub(r'^##\s+\[.*?\].*?\n', '', notes).strip()
              Path('release_notes.md').write_text(notes_body)
              print('Found release notes:')
              print(notes_body)
          else:
              print('No release notes found for $VER_NUM')
              Path('release_notes.md').write_text('Release notes for ' + '$VERSION')
          "

      - name: Append download & install instructions
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve-tag.outputs.VERSION }}"
          TAG="${{ steps.resolve-tag.outputs.tag }}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat >> release_notes.md <<EOF

          ---

          ## Download & install

          | Platform | Download |
          |----------|----------|
          | Windows (x64) | [\`Theorem_${VERSION}_x64-setup.exe\`](${BASE}/Theorem_${VERSION}_x64-setup.exe) |
          | Windows (x64, MSI) | [\`Theorem_${VERSION}_x64_en-US.msi\`](${BASE}/Theorem_${VERSION}_x64_en-US.msi) |
          | macOS (Apple Silicon) | [\`Theorem_${VERSION}_aarch64.dmg\`](${BASE}/Theorem_${VERSION}_aarch64.dmg) |
          | macOS (Intel) | [\`Theorem_${VERSION}_x64.dmg\`](${BASE}/Theorem_${VERSION}_x64.dmg) |
          | Linux (Debian/Ubuntu) | [\`Theorem_${VERSION}_amd64.deb\`](${BASE}/Theorem_${VERSION}_amd64.deb) |
          | Linux (any) | [\`Theorem_${VERSION}_amd64.AppImage\`](${BASE}/Theorem_${VERSION}_amd64.AppImage) |
          | Android (arm64, most phones) | [\`app-arm64-release.apk\`](${BASE}/app-arm64-release.apk) |
          | Android (32-bit arm) | [\`app-arm-release.apk\`](${BASE}/app-arm-release.apk) |
          | Android (x86_64 emulator) | [\`app-x86_64-release.apk\`](${BASE}/app-x86_64-release.apk) |
          | Android (x86 emulator) | [\`app-x86-release.apk\`](${BASE}/app-x86-release.apk) |

          **Linux one-liner:** \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install-linux.sh | bash\`

          > Desktop builds **auto-update** in place (Settings → Help → Check for Updates). Android updates are manual unless installed via F-Droid.
          EOF

      - name: Create or Update Release
        id: create-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve-tag.outputs.tag }}
          name: Theorem ${{ steps.resolve-tag.outputs.VERSION }}
          body_path: release_notes.md
          draft: true
          prerelease: ${{ steps.resolve-tag.outputs.prerelease }}
          generate_release_notes: false

  frontend:
    name: Prepare release frontend
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.release_sha }}
          submodules: recursive
      - uses: ./.github/actions/build-release-frontend

  build-linux:
    name: Build Linux
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [create-release, frontend]
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.release_sha }}
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libunwind-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav autoconf automake libtool

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/restore-release-frontend

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseName: "Theorem ${{ env.RELEASE_TAG }}"
          releaseDraft: true
          prerelease: ${{ needs.create-release.outputs.prerelease }}
          retryAttempts: 2
          args: --target x86_64-unknown-linux-gnu --config src-tauri/tauri.ci.conf.json

      - name: Verify installers and updater signatures
        shell: bash
        env:
          EXPECTED_ASSETS: "deb/*.deb appimage/*.AppImage appimage/*.AppImage.sig"
        run: bash scripts/check-release-assets.sh "$EXPECTED_ASSETS"

  build-macos-intel:
    name: Build macOS (Intel)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 120
    needs: [create-release, frontend]
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
      CFLAGS: "-arch x86_64"
      CXXFLAGS: "-arch x86_64"
      LDFLAGS: "-arch x86_64"
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.release_sha }}
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install macOS build dependencies
        run: brew install autoconf automake libtool

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/restore-release-frontend

      - name: Resolve macOS signing mode
        id: macos-signing
        shell: bash
        run: |
          if [[ "${{ vars.ENABLE_MACOS_SIGNING }}" == "true" \
            && -n "${{ secrets.APPLE_CERTIFICATE }}" \
            && -n "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            && -n "${{ secrets.APPLE_ID }}" \
            && -n "${{ secrets.APPLE_PASSWORD }}" \
            && -n "${{ secrets.APPLE_TEAM_ID }}" ]]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app (signed)
        if: steps.macos-signing.outputs.mode == 'signed'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseName: "Theorem ${{ env.RELEASE_TAG }}"
          releaseDraft: true
          prerelease: ${{ needs.create-release.outputs.prerelease }}
          retryAttempts: 2
          args: --target x86_64-apple-darwin --config src-tauri/tauri.ci.conf.json

      - name: Build Tauri app (ad-hoc signing)
        if: steps.macos-signing.outputs.mode == 'adhoc'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseName: "Theorem ${{ env.RELEASE_TAG }}"
          releaseDraft: true
          prerelease: ${{ needs.create-release.outputs.prerelease }}
          retryAttempts: 2
          args: --target x86_64-apple-darwin --config src-tauri/tauri.ci.conf.json

      - name: Verify installers and updater signatures
        shell: bash
        env:
          EXPECTED_ASSETS: "dmg/*.dmg macos/*.app.tar.gz macos/*.app.tar.gz.sig"
        run: bash scripts/check-release-assets.sh "$EXPECTED_ASSETS"

  build-macos-arm:
    name: Build macOS (Apple Silicon)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 120
    needs: [create-release, frontend]
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.release_sha }}
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install macOS build dependencies
        run: brew install autoconf automake libtool

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/restore-release-frontend

      - name: Resolve macOS signing mode
        id: macos-signing
        shell: bash
        run: |
          if [[ "${{ vars.ENABLE_MACOS_SIGNING }}" == "true" \
            && -n "${{ secrets.APPLE_CERTIFICATE }}" \
            && -n "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            && -n "${{ secrets.APPLE_ID }}" \
            && -n "${{ secrets.APPLE_PASSWORD }}" \
            && -n "${{ secrets.APPLE_TEAM_ID }}" ]]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app (signed)
        if: steps.macos-signing.outputs.mode == 'signed'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseName: "Theorem ${{ env.RELEASE_TAG }}"
          releaseDraft: true
          prerelease: ${{ needs.create-release.outputs.prerelease }}
          retryAttempts: 2
          args: --target aarch64-apple-darwin --config src-tauri/tauri.ci.conf.json

      - name: Build Tauri app (ad-hoc signing)
        if: steps.macos-signing.outputs.mode == 'adhoc'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseName: "Theorem ${{ env.RELEASE_TAG }}"
          releaseDraft: true
          prerelease: ${{ needs.create-release.outputs.prerelease }}
          retryAttempts: 2
          args: --target aarch64-apple-darwin --config src-tauri/tauri.ci.conf.json

      - name: Verify installers and updater signatures
        shell: bash
        env:
          EXPECTED_ASSETS: "dmg/*.dmg macos/*.app.tar.gz macos/*.app.tar.gz.sig"
        run: bash scripts/check-release-assets.sh "$EXPECTED_ASSETS"

  build-windows:
    name: Build Windows
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 120
    needs: [create-release, frontend]
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.release_sha }}
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/restore-release-frontend

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseName: "Theorem ${{ env.RELEASE_TAG }}"
          releaseDraft: true
          prerelease: ${{ needs.create-release.outputs.prerelease }}
          retryAttempts: 2
          args: --config src-tauri/tauri.ci.conf.json

      - name: Verify installers and updater signatures
        shell: bash
        env:
          EXPECTED_ASSETS: "nsis/*-setup.exe nsis/*-setup.exe.sig msi/*.msi msi/*.msi.sig"
        run: bash scripts/check-release-assets.sh "$EXPECTED_ASSETS"

  build-android:
    name: Build Android
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [create-release, frontend]
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.release_sha }}
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK
        run: sdkmanager "ndk;29.0.13846066"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/restore-release-frontend

      - name: Initialize Android project
        run: pnpm tauri android init --ci

      - name: Android launcher icon
        run: git checkout -- src-tauri/gen/android/app/src/main/res

      - name: Disable Android release minification
        run: |
          sed -i '0,/isMinifyEnabled = true/s//isMinifyEnabled = false/' src-tauri/gen/android/app/build.gradle.kts
          grep -n "isMinifyEnabled" src-tauri/gen/android/app/build.gradle.kts

      - name: Configure Android Gradle signing
        shell: bash
        run: |
          FILE="src-tauri/gen/android/app/build.gradle.kts"

          if ! grep -q 'import java.io.FileInputStream' "$FILE"; then
            sed -i '1a import java.io.FileInputStream' "$FILE"
          fi

          if ! grep -q 'signingConfigs {' "$FILE"; then
            printf '%s\n' \
              'signingConfigs {' \
              '    create("release") {' \
              '        val keystorePropertiesFile = rootProject.file("keystore.properties")' \
              '        val keystoreProperties = Properties()' \
              '        if (keystorePropertiesFile.exists()) {' \
              '            keystoreProperties.load(FileInputStream(keystorePropertiesFile))' \
              '        }' \
              '        keyAlias = keystoreProperties["keyAlias"] as String' \
              '        keyPassword = keystoreProperties["password"] as String' \
              '        storeFile = file(keystoreProperties["storeFile"] as String)' \
              '        storePassword = keystoreProperties["password"] as String' \
              '    }' \
              '}' > /tmp/theorem-signing-snippet.kts
            awk '
              BEGIN { inserted=0 }
              /buildTypes \{/ && !inserted {
                while ((getline line < "/tmp/theorem-signing-snippet.kts") > 0) {
                  print "    " line
                }
                close("/tmp/theorem-signing-snippet.kts")
                inserted=1
              }
              { print }
            ' "$FILE" > "$FILE.tmp"
            mv "$FILE.tmp" "$FILE"
          fi

          if ! grep -q 'signingConfig = signingConfigs.getByName("release")' "$FILE"; then
            sed -i '/getByName("release") {/a\            signingConfig = signingConfigs.getByName("release")' "$FILE"
          fi

          grep -n 'FileInputStream\|signingConfigs\|signingConfig = signingConfigs.getByName("release")' "$FILE"

      - name: Debug Android signing inputs (safe)
        shell: bash
        run: |
          echo "secret.ANDROID_KEY_BASE64 set: ${{ secrets.ANDROID_KEY_BASE64 != '' }}"
          echo "secret.ANDROID_KEYSTORE_BASE64 set: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}"
          echo "secret.ANDROID_KEY_ALIAS set: ${{ secrets.ANDROID_KEY_ALIAS != '' }}"
          echo "secret.ANDROID_KEY_PASSWORD set: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}"
          echo "secret.ANDROID_KEYSTORE_PASSWORD set: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}"
          echo "var.ANDROID_KEY_BASE64 set: ${{ vars.ANDROID_KEY_BASE64 != '' }}"
          echo "var.ANDROID_KEYSTORE_BASE64 set: ${{ vars.ANDROID_KEYSTORE_BASE64 != '' }}"
          echo "var.ANDROID_KEY_ALIAS set: ${{ vars.ANDROID_KEY_ALIAS != '' }}"
          echo "var.ANDROID_KEY_PASSWORD set: ${{ vars.ANDROID_KEY_PASSWORD != '' }}"
          echo "var.ANDROID_KEYSTORE_PASSWORD set: ${{ vars.ANDROID_KEYSTORE_PASSWORD != '' }}"

      - name: Validate Android signing secrets
        shell: bash
        env:
          ANDROID_KEY_BASE64_VAR: ${{ vars.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEYSTORE_BASE64_VAR: ${{ vars.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_VAR: ${{ vars.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_VAR: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_VAR: ${{ vars.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEY_B64="$ANDROID_KEY_BASE64"
          if [[ -z "$KEY_B64" ]]; then
            KEY_B64="$ANDROID_KEYSTORE_BASE64"
          fi
          if [[ -z "$KEY_B64" ]]; then
            KEY_B64="$ANDROID_KEY_BASE64_VAR"
          fi
          if [[ -z "$KEY_B64" ]]; then
            KEY_B64="$ANDROID_KEYSTORE_BASE64_VAR"
          fi
          KEY_ALIAS="$ANDROID_KEY_ALIAS"
          if [[ -z "$KEY_ALIAS" ]]; then
            KEY_ALIAS="$ANDROID_KEY_ALIAS_VAR"
          fi
          KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          if [[ -z "$KEY_PASSWORD" ]]; then
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD_VAR"
          fi
          STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          if [[ -z "$STORE_PASSWORD" ]]; then
            STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD_VAR"
          fi
          if [[ -z "$STORE_PASSWORD" ]]; then
            STORE_PASSWORD="$KEY_PASSWORD"
          fi
          if [[ -z "$KEY_B64" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing Android signing settings. Required: ANDROID_KEY_BASE64 (or ANDROID_KEYSTORE_BASE64), ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Optional: ANDROID_KEYSTORE_PASSWORD (defaults to ANDROID_KEY_PASSWORD)."
            exit 1
          fi

      - name: Setup Android signing
        shell: bash
        env:
          ANDROID_KEY_BASE64_VAR: ${{ vars.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEYSTORE_BASE64_VAR: ${{ vars.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_VAR: ${{ vars.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_VAR: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_VAR: ${{ vars.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEY_B64="$ANDROID_KEY_BASE64"
          if [[ -z "$KEY_B64" ]]; then
            KEY_B64="$ANDROID_KEYSTORE_BASE64"
          fi
          if [[ -z "$KEY_B64" ]]; then
            KEY_B64="$ANDROID_KEY_BASE64_VAR"
          fi
          if [[ -z "$KEY_B64" ]]; then
            KEY_B64="$ANDROID_KEYSTORE_BASE64_VAR"
          fi
          KEY_ALIAS="$ANDROID_KEY_ALIAS"
          if [[ -z "$KEY_ALIAS" ]]; then
            KEY_ALIAS="$ANDROID_KEY_ALIAS_VAR"
          fi
          KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          if [[ -z "$KEY_PASSWORD" ]]; then
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD_VAR"
          fi
          STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          if [[ -z "$STORE_PASSWORD" ]]; then
            STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD_VAR"
          fi
          if [[ -z "$STORE_PASSWORD" ]]; then
            STORE_PASSWORD="$KEY_PASSWORD"
          fi
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/theorem-release.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=$KEY_ALIAS
          password=$KEY_PASSWORD
          storeFile=$RUNNER_TEMP/theorem-release.jks
          EOF

      - name: Build Android release artifacts
        run: pnpm tauri android build --split-per-abi --config src-tauri/tauri.ci.conf.json

      - name: Collect signed Android artifacts
        shell: bash
        run: |
          mkdir -p android-release
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*-unsigned.apk' -exec cp {} android-release/ \;
          find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -exec cp {} android-release/ \;
          ls -lah android-release
          node -e "const fs = require('node:fs'); require('./scripts/release-target.cjs').assertAndroidReleaseFiles(fs.readdirSync('android-release'));"

      - name: Upload Android artifacts (attempt 1)
        id: upload-android-attempt-1
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: |
            android-release/*.apk
            android-release/*.aab

      - name: Upload Android artifacts (retry)
        if: steps.upload-android-attempt-1.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: |
            android-release/*.apk
            android-release/*.aab

  publish-release:
    name: Publish Release
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [create-release, build-linux, build-macos-intel, build-macos-arm, build-windows, build-android]
    if: >-
      always() &&
      needs.build-linux.result == 'success' &&
      needs.build-macos-intel.result == 'success' &&
      needs.build-macos-arm.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-android.result == 'success'
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.release_sha }}

      - name: Verify release assets, reconcile latest.json, and publish
        uses: actions/github-script@v8
        with:
          script: |
            const { assertReleaseAssets, buildUpdaterManifest } = require('./scripts/release-target.cjs');
            const release_id = Number(${{ toJSON(needs.create-release.outputs.release_id) }});
            const tag = ${{ toJSON(needs.create-release.outputs.release_tag) }};
            const { data: release } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            if (!release.draft || release.tag_name !== tag) {
              throw new Error('The prepared release is no longer the expected draft; refusing to publish.');
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo,
              release_id,
              per_page: 100,
            });
            assertReleaseAssets(assets.map((asset) => asset.name));

            const sigAssets = assets.filter((asset) => asset.name.endsWith('.sig'));
            const signaturesByAsset = {};
            for (const asset of sigAssets) {
              const resp = await github.rest.repos.getReleaseAsset({
                ...context.repo,
                asset_id: asset.id,
                headers: { accept: 'application/octet-stream' },
              });
              const content = Buffer.isBuffer(resp.data)
                ? resp.data.toString('utf8')
                : typeof resp.data === 'string'
                  ? resp.data
                  : Buffer.from(resp.data).toString('utf8');
              signaturesByAsset[asset.name] = content;
            }
            const manifest = buildUpdaterManifest({
              version: tag,
              notes: `Theorem ${tag}`,
              pubDate: new Date().toISOString(),
              downloadBaseUrl: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}`,
              signaturesByAsset,
            });
            for (const existing of assets.filter((asset) => asset.name === 'latest.json')) {
              await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: existing.id });
            }
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo,
              release_id,
              name: 'latest.json',
              data: JSON.stringify(manifest, null, 2),
              headers: { 'content-type': 'application/json' },
            });
            await github.rest.repos.updateRelease({ ...context.repo, release_id, draft: false });

      # GITHUB_TOKEN publication does not trigger the release-event workflow.
      - name: Notify Studio & Landing
        uses: ./.github/actions/notify-landing
        with:
          ref: ${{ needs.create-release.outputs.release_tag }}
          sha: ${{ needs.create-release.outputs.release_sha }}
          deploy-landing: 'true'
        env:
          GH_TOKEN: ${{ secrets.STUDIO_SYNC_TOKEN }}
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
