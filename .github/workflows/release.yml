name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to update (e.g. v1.0.0-5)
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
      release_tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Resolve release tag
        id: resolve-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check existing release tag
        id: release-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --write-out '\n%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          status="$(printf '%s' "${response}" | tail -n1)"
          body="$(printf '%s' "${response}" | sed '$d')"
          if [[ "${status}" == "200" ]]; then
            release_id="$(printf '%s' "${body}" | jq -r '.id // empty')"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
            echo "Release for ${RELEASE_TAG} already exists and will be updated."
          elif [[ "${status}" == "404" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "release_id=" >> "$GITHUB_OUTPUT"
            echo "::notice::No release found for ${RELEASE_TAG}. A new draft release will be created."
          else
            echo "::error::GitHub API returned unexpected status ${status} while checking release tag ${RELEASE_TAG}."
            exit 1
          fi

      - name: Get version display
        id: version-display
        run: echo "VERSION=${{ steps.resolve-tag.outputs.tag }}" | sed 's/^v//' >> $GITHUB_OUTPUT

      - name: Extract Release Notes
        id: release-notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve-tag.outputs.tag }}"
          VER_NUM="${VERSION#v}"
          python3 -c "
          import re
          from pathlib import Path
          changelog = Path('CHANGELOG.md').read_text()
          pattern = r'(## \[' + re.escape('$VER_NUM') + r'\].*?)(?=\n## \[|\Z)'
          match = re.search(pattern, changelog, re.DOTALL)
          if match:
              notes = match.group(1).strip()
              # Remove the title header ## [1.0.4] - 2026-07-03 from the body since we set it in the release name
              notes_body = re.sub(r'^##\s+\[.*?\].*?\n', '', notes).strip()
              Path('release_notes.md').write_text(notes_body)
              print('Found release notes:')
              print(notes_body)
          else:
              print('No release notes found for $VER_NUM')
              Path('release_notes.md').write_text('Release notes for ' + '$VERSION')
          "

      - name: Append download & install instructions
        run: |
          set -euo pipefail
          VERSION="${{ steps.version-display.outputs.VERSION }}"
          TAG="${{ steps.resolve-tag.outputs.tag }}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat >> release_notes.md <<EOF

          ---

          ## Download & install

          | Platform | Download |
          |----------|----------|
          | Windows (x64) | [\`Theorem_${VERSION}_x64-setup.exe\`](${BASE}/Theorem_${VERSION}_x64-setup.exe) |
          | macOS (Apple Silicon) | [\`Theorem_${VERSION}_aarch64.dmg\`](${BASE}/Theorem_${VERSION}_aarch64.dmg) |
          | macOS (Intel) | [\`Theorem_${VERSION}_x64.dmg\`](${BASE}/Theorem_${VERSION}_x64.dmg) |
          | Linux (Debian/Ubuntu) | [\`Theorem_${VERSION}_amd64.deb\`](${BASE}/Theorem_${VERSION}_amd64.deb) |
          | Linux (any) | [\`Theorem_${VERSION}_amd64.AppImage\`](${BASE}/Theorem_${VERSION}_amd64.AppImage) |
          | Android (arm64) | [\`app-arm64-release.apk\`](${BASE}/app-arm64-release.apk) |

          **Linux one-liner:** \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install-linux.sh | bash\`

          > Desktop builds **auto-update** in place (Settings → About → Check for Updates). Android updates are manual unless installed via F-Droid.
          EOF

      - name: Create or Update Release
        id: create-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve-tag.outputs.tag }}
          name: Theorem ${{ steps.version-display.outputs.VERSION }}
          body_path: release_notes.md
          draft: true
          prerelease: ${{ contains(steps.version-display.outputs.VERSION, '-') }}
          generate_release_notes: false

  build-linux:
    name: Build Linux
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: create-release
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync foliate-js submodule
        run: bash scripts/sync-foliate-js.sh

      - name: Regenerate platform icons from source
        run: pnpm tauri icon public/favicon.svg

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Theorem ${{ env.RELEASE_TAG }}"
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          retryAttempts: 2
          args: --target x86_64-unknown-linux-gnu

  build-macos-intel:
    name: Build macOS (Intel)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    needs: create-release
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
      CFLAGS: "-arch x86_64"
      CXXFLAGS: "-arch x86_64"
      LDFLAGS: "-arch x86_64"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install macOS build dependencies
        run: brew install autoconf automake libtool

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-intel-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-intel-cargo-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate platform icons from source
        run: pnpm tauri icon public/favicon.svg

      - name: Resolve macOS signing mode
        id: macos-signing
        shell: bash
        run: |
          if [[ "${{ vars.ENABLE_MACOS_SIGNING }}" == "true" \
            && -n "${{ secrets.APPLE_CERTIFICATE }}" \
            && -n "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            && -n "${{ secrets.APPLE_ID }}" \
            && -n "${{ secrets.APPLE_PASSWORD }}" \
            && -n "${{ secrets.APPLE_TEAM_ID }}" ]]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app (signed)
        if: steps.macos-signing.outputs.mode == 'signed'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Theorem ${{ env.RELEASE_TAG }}"
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          retryAttempts: 2
          args: --target x86_64-apple-darwin

      - name: Build Tauri app (ad-hoc signing)
        if: steps.macos-signing.outputs.mode == 'adhoc'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Theorem ${{ env.RELEASE_TAG }}"
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          retryAttempts: 2
          args: --target x86_64-apple-darwin

  build-macos-arm:
    name: Build macOS (Apple Silicon)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    needs: create-release
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install macOS build dependencies
        run: brew install autoconf automake libtool

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-arm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm-cargo-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate platform icons from source
        run: pnpm tauri icon public/favicon.svg

      - name: Resolve macOS signing mode
        id: macos-signing
        shell: bash
        run: |
          if [[ "${{ vars.ENABLE_MACOS_SIGNING }}" == "true" \
            && -n "${{ secrets.APPLE_CERTIFICATE }}" \
            && -n "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            && -n "${{ secrets.APPLE_ID }}" \
            && -n "${{ secrets.APPLE_PASSWORD }}" \
            && -n "${{ secrets.APPLE_TEAM_ID }}" ]]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app (signed)
        if: steps.macos-signing.outputs.mode == 'signed'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Theorem ${{ env.RELEASE_TAG }}"
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          retryAttempts: 2
          args: --target aarch64-apple-darwin

      - name: Build Tauri app (ad-hoc signing)
        if: steps.macos-signing.outputs.mode == 'adhoc'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Theorem ${{ env.RELEASE_TAG }}"
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          retryAttempts: 2
          args: --target aarch64-apple-darwin

  build-windows:
    name: Build Windows
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: create-release
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Theorem ${{ env.RELEASE_TAG }}"
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          retryAttempts: 2

  build-android:
    name: Build Android
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: create-release
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;29.0.13846066"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Android project
        run: pnpm tauri android init --ci

      - name: Generate branded Android launcher icons
        run: pnpm tauri icon public/favicon.svg

      - name: Disable Android release minification
        run: |
          sed -i '0,/isMinifyEnabled = true/s//isMinifyEnabled = false/' src-tauri/gen/android/app/build.gradle.kts
          grep -n "isMinifyEnabled" src-tauri/gen/android/app/build.gradle.kts

      - name: Configure Android Gradle signing
        shell: bash
        run: |
          FILE="src-tauri/gen/android/app/build.gradle.kts"

          if ! grep -q 'import java.io.FileInputStream' "$FILE"; then
            sed -i '1a import java.io.FileInputStream' "$FILE"
          fi

          if ! grep -q 'signingConfigs {' "$FILE"; then
            printf '%s\n' \
              'signingConfigs {' \
              '    create("release") {' \
              '        val keystorePropertiesFile = rootProject.file("keystore.properties")' \
              '        val keystoreProperties = Properties()' \
              '        if (keystorePropertiesFile.exists()) {' \
              '            keystoreProperties.load(FileInputStream(keystorePropertiesFile))' \
              '        }' \
              '        keyAlias = keystoreProperties["keyAlias"] as String' \
              '        keyPassword = keystoreProperties["password"] as String' \
              '        storeFile = file(keystoreProperties["storeFile"] as String)' \
              '        storePassword = keystoreProperties["password"] as String' \
              '    }' \
              '}' > /tmp/theorem-signing-snippet.kts
            awk '
              BEGIN { inserted=0 }
              /buildTypes \{/ && !inserted {
                while ((getline line < "/tmp/theorem-signing-snippet.kts") > 0) {
                  print "    " line
                }
                close("/tmp/theorem-signing-snippet.kts")
                inserted=1
              }
              { print }
            ' "$FILE" > "$FILE.tmp"
            mv "$FILE.tmp" "$FILE"
          fi

          if ! grep -q 'signingConfig = signingConfigs.getByName("release")' "$FILE"; then
            sed -i '/getByName("release") {/a\            signingConfig = signingConfigs.getByName("release")' "$FILE"
          fi

          grep -n 'FileInputStream\|signingConfigs\|signingConfig = signingConfigs.getByName("release")' "$FILE"

      - name: Debug Android signing inputs (safe)
        shell: bash
        run: |
          echo "secret.ANDROID_KEY_BASE64 set: ${{ secrets.ANDROID_KEY_BASE64 != '' }}"
          echo "secret.ANDROID_KEYSTORE_BASE64 set: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}"
          echo "secret.ANDROID_KEY_ALIAS set: ${{ secrets.ANDROID_KEY_ALIAS != '' }}"
          echo "secret.ANDROID_KEY_PASSWORD set: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}"
          echo "secret.ANDROID_KEYSTORE_PASSWORD set: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}"
          echo "var.ANDROID_KEY_BASE64 set: ${{ vars.ANDROID_KEY_BASE64 != '' }}"
          echo "var.ANDROID_KEYSTORE_BASE64 set: ${{ vars.ANDROID_KEYSTORE_BASE64 != '' }}"
          echo "var.ANDROID_KEY_ALIAS set: ${{ vars.ANDROID_KEY_ALIAS != '' }}"
          echo "var.ANDROID_KEY_PASSWORD set: ${{ vars.ANDROID_KEY_PASSWORD != '' }}"
          echo "var.ANDROID_KEYSTORE_PASSWORD set: ${{ vars.ANDROID_KEYSTORE_PASSWORD != '' }}"

      - name: Validate Android signing secrets
        shell: bash
        env:
          ANDROID_KEY_BASE64_VAR: ${{ vars.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEYSTORE_BASE64_VAR: ${{ vars.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_VAR: ${{ vars.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_VAR: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_VAR: ${{ vars.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEY_B64="$ANDROID_KEY_BASE64"
          if [[ -z "$KEY_B64" ]]; then
            KEY_B64="$ANDROID_KEYSTORE_BASE64"
          fi
          if [[ -z "$KEY_B64" ]]; then
            KEY_B64="$ANDROID_KEY_BASE64_VAR"
          fi
          if [[ -z "$KEY_B64" ]]; then
            KEY_B64="$ANDROID_KEYSTORE_BASE64_VAR"
          fi
          KEY_ALIAS="$ANDROID_KEY_ALIAS"
          if [[ -z "$KEY_ALIAS" ]]; then
            KEY_ALIAS="$ANDROID_KEY_ALIAS_VAR"
          fi
          KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          if [[ -z "$KEY_PASSWORD" ]]; then
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD_VAR"
          fi
          STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          if [[ -z "$STORE_PASSWORD" ]]; then
            STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD_VAR"
          fi
          if [[ -z "$STORE_PASSWORD" ]]; then
            STORE_PASSWORD="$KEY_PASSWORD"
          fi
          if [[ -z "$KEY_B64" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing Android signing settings. Required: ANDROID_KEY_BASE64 (or ANDROID_KEYSTORE_BASE64), ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Optional: ANDROID_KEYSTORE_PASSWORD (defaults to ANDROID_KEY_PASSWORD)."
            exit 1
          fi

      - name: Setup Android signing
        shell: bash
        env:
          ANDROID_KEY_BASE64_VAR: ${{ vars.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEYSTORE_BASE64_VAR: ${{ vars.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_VAR: ${{ vars.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_VAR: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_VAR: ${{ vars.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEY_B64="$ANDROID_KEY_BASE64"
          if [[ -z "$KEY_B64" ]]; then
            KEY_B64="$ANDROID_KEYSTORE_BASE64"
          fi
          if [[ -z "$KEY_B64" ]]; then
            KEY_B64="$ANDROID_KEY_BASE64_VAR"
          fi
          if [[ -z "$KEY_B64" ]]; then
            KEY_B64="$ANDROID_KEYSTORE_BASE64_VAR"
          fi
          KEY_ALIAS="$ANDROID_KEY_ALIAS"
          if [[ -z "$KEY_ALIAS" ]]; then
            KEY_ALIAS="$ANDROID_KEY_ALIAS_VAR"
          fi
          KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          if [[ -z "$KEY_PASSWORD" ]]; then
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD_VAR"
          fi
          STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          if [[ -z "$STORE_PASSWORD" ]]; then
            STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD_VAR"
          fi
          if [[ -z "$STORE_PASSWORD" ]]; then
            STORE_PASSWORD="$KEY_PASSWORD"
          fi
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/theorem-release.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=$KEY_ALIAS
          password=$KEY_PASSWORD
          storeFile=$RUNNER_TEMP/theorem-release.jks
          EOF

      - name: Build Android release artifacts
        run: pnpm tauri android build --split-per-abi

      - name: Collect signed Android artifacts
        shell: bash
        run: |
          mkdir -p android-release
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*-unsigned.apk' -exec cp {} android-release/ \;
          find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -exec cp {} android-release/ \;
          ls -lah android-release
          if ! compgen -G "android-release/*.apk" > /dev/null; then
            echo "::error::No signed APK found in build outputs."
            exit 1
          fi

      - name: Upload Android artifacts (attempt 1)
        id: upload-android-attempt-1
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: |
            android-release/*.apk
            android-release/*.aab

      - name: Upload Android artifacts (retry)
        if: steps.upload-android-attempt-1.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: |
            android-release/*.apk
            android-release/*.aab

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [create-release, build-linux, build-macos-intel, build-macos-arm, build-windows, build-android]
    if: >-
      always() &&
      needs.build-linux.result == 'success' &&
      needs.build-macos-intel.result == 'success' &&
      needs.build-macos-arm.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-android.result == 'success'
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Publish Release
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
