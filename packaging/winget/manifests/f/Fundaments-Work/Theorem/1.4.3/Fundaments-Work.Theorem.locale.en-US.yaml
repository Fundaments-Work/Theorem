ShortDescription: Local-first EPUB, PDF, MOBI and RSS reader with highlights, TTS and Markdown export.
Description: >-
  Theorem is a free, open-source, local-first reading app for Windows, macOS,
  Linux and Android. Read EPUB, PDF, MOBI, FB2, CBZ/CBR and RSS; highlight and
  annotate with six colors; look up words offline; listen with text-to-speech or
  a neural voice; and export everything to Markdown for Obsidian/Logseq. Sync
  between devices over encrypted peer-to-peer LAN without a cloud account.
